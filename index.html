
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f5">
    <meta name="description" content="A polished, real-time chat application project demo.">
    <title>Chatter — thoughtful conversations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.7-3.4A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8.5 11.5h.01m3.49 0h.01m3.49 0h.01"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v11h14V9m-8 4h2"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.6.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.6-.9l-1.7.7-1.4-2.4 1.4-1.1a8 8 0 0 1 0-1.9l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.6-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.6.9l1.7-.7 1.4 2.4-1.4 1.1a8 8 0 0 1-.1 1.9Z" transform="translate(-1 -1) scale(1.08)"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4 4"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.1 5.2 2 2 0 0 1 5.1 3h3a2 2 0 0 1 2 1.7l.5 2.8a2 2 0 0 1-.6 1.8L8.1 11a16 16 0 0 0 4.9 4.9l1.7-1.9a2 2 0 0 1 1.8-.6l2.8.5a2 2 0 0 1 1.7 2Z"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/></symbol>
      <symbol id="i-attach" viewBox="0 0 24 24"><path d="m21.4 11.1-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l9.2-9.2a3.7 3.7 0 1 1 5.2 5.2l-9.2 9.2a1.8 1.8 0 1 1-2.6-2.6l8.5-8.5"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
      <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-checks" viewBox="0 0 24 24"><path d="m2 12 4 4L16 6m-6 10 2 2 10-10"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6m-12 5h8m-8 4h8"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 13h4"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m5 5H9"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2m-7 9v3m-4 0h8"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3Zm7 12 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6M20 12H9"/></symbol>
    </svg>

    <main class="app-shell">
      <nav class="nav-rail" aria-label="Main navigation">
        <a class="brand-mark" href="#" aria-label="Chatter home"><svg><use href="#i-chat"/></svg><span class="brand-dot"></span></a>
        <div class="rail-links">
          <button class="rail-button active" aria-label="Chats" title="Chats"><svg><use href="#i-chat"/></svg><span class="rail-indicator"></span></button>
          <button class="rail-button" data-action="contacts" aria-label="Contacts" title="Contacts"><svg><use href="#i-users"/></svg></button>
          <button class="rail-button" data-action="files" aria-label="Shared files" title="Shared files"><svg><use href="#i-archive"/></svg></button>
        </div>
        <div class="rail-bottom">
          <button class="rail-button" data-action="settings" aria-label="Settings" title="Settings"><svg><use href="#i-settings"/></svg></button>
          <button class="avatar avatar-you" data-action="settings" aria-label="Open your profile"><span id="rail-initials" class="avatar-content">JD</span><span class="presence-dot"></span></button>
        </div>
      </nav>

      <aside class="sidebar">
        <header class="sidebar-header">
          <div>
            <div class="eyebrow"><span class="live-dot"></span> YOUR LITTLE CORNER</div>
            <h1>Messages<span class="heading-count" id="conversation-count">4</span></h1>
          </div>
          <button class="icon-button new-chat-button" data-action="new-chat" aria-label="Start a new chat" title="New chat"><svg><use href="#i-plus"/></svg></button>
        </header>

        <label class="search-box">
          <svg><use href="#i-search"/></svg>
          <input id="chat-search" type="search" placeholder="Search conversations" autocomplete="off" aria-label="Search conversations and contacts">
          <kbd>⌘ K</kbd>
        </label>

        <div class="filter-tabs" role="tablist" aria-label="Conversation filter">
          <button class="filter-tab selected" data-filter="all" role="tab" aria-selected="true">All <span id="all-count">4</span></button>
          <button class="filter-tab" data-filter="unread" role="tab" aria-selected="false">Unread <span id="unread-count">2</span></button>
          <button class="filter-tab" data-filter="favorites" role="tab" aria-selected="false">Favorites</button>
        </div>

        <section class="conversation-section" aria-label="Your conversations">
          <div class="section-label"><span>PINNED</span><span class="section-dash"></span></div>
          <div id="pinned-list" class="conversation-list"></div>
          <div class="section-label recent-label"><span>ALL CHATS</span><span class="section-dash"></span></div>
          <div id="conversation-list" class="conversation-list"></div>
          <div id="empty-search" class="empty-search" hidden>
            <span class="empty-search-icon"><svg><use href="#i-search"/></svg></span>
            <strong>No conversations found</strong>
            <span>Try another name or start a new chat.</span>
          </div>
        </section>

        <footer class="sidebar-footer">
          <span class="footer-spark"><svg><use href="#i-spark"/></svg></span>
          <span>Good conversations<br><strong>make good days.</strong></span>
          <span class="footer-heart">✳</span>
        </footer>
      </aside>

      <section class="chat-panel" aria-label="Chat">
        <header id="chat-header" class="chat-header"></header>
        <div id="messages" class="messages-area" aria-live="polite" aria-relevant="additions text"></div>
        <div class="typing-indicator" id="typing-indicator" hidden><span class="typing-dots"><i></i><i></i><i></i></span><span id="typing-name"></span> is typing</div>
        <form class="composer" id="message-form">
          <div class="composer-toolbar">
            <button class="tool-button" type="button" data-action="attach" aria-label="Attach a file" title="Attach a file"><svg><use href="#i-attach"/></svg></button>
            <button class="tool-button emoji-trigger" type="button" data-action="emoji" aria-label="Add a smile" title="Add a smile"><svg><use href="#i-smile"/></svg></button>
            <span class="toolbar-separator"></span>
            <span class="composer-hint">Make someone's day ✨</span>
            <button class="tool-button voice-button" type="button" data-action="voice" aria-label="Voice messages" title="Voice messages"><svg><use href="#i-mic"/></svg></button>
          </div>
          <div class="composer-input-row">
            <textarea id="message-input" rows="1" placeholder="Write a message..." aria-label="Write a message"></textarea>
            <button class="send-button" type="submit" aria-label="Send message"><svg><use href="#i-send"/></svg></button>
          </div>
          <div class="composer-bottom"><span>Press <kbd>Enter</kbd> to send <span class="composer-bottom-dot">·</span> <kbd>Shift + Enter</kbd> for a new line</span><span class="encryption-label"><span class="lock-mark">✳</span> PRIVATE CONVERSATION</span></div>
        </form>
      </section>

      <aside class="details-panel" id="details-panel" aria-label="Contact details"></aside>
    </main>

    <input id="file-input" type="file" hidden multiple>
    <div id="modal-root"></div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="app.js"></script>
  </body>
</html>
